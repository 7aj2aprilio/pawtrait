version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawtrait-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - MIDTRANS_IS_SANITIZED=${MIDTRANS_IS_SANITIZED:-true}
      - MIDTRANS_IS_3DS=${MIDTRANS_IS_3DS:-true}
      - DB_HOST=db
      - DB_USER=pawtrait
      - DB_PASS=pawtrait_secret
      - DB_NAME=photobooth_db
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pawtrait-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: pawtrait-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: photobooth_db
      MYSQL_USER: pawtrait
      MYSQL_PASSWORD: pawtrait_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawtrait-network

  # phpMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pawtrait-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: pawtrait
      PMA_PASSWORD: pawtrait_secret
    depends_on:
      - db
    networks:
      - pawtrait-network

networks:
  pawtrait-network:
    driver: bridge

volumes:
  db_data:
